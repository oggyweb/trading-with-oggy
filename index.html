<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale5.0">
    <title>TRADING WITH OGGY - Live Market Dashboard</title>
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- TradingView Lightweight Charts -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { background: #0b0f19; color: #f8fafc; font-family: 'Courier New', Courier, monospace; }
        .neon-glow { text-shadow: 0 0 10px rgba(74, 222, 128, 0.5); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <!-- Header -->
    <header class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center mb-6 bg-slate-900/80 p-4 rounded-xl border border-slate-800 shadow-xl">
        <div>
            <h1 class="text-2xl font-bold text-green-400 neon-glow">📈 TRADING WITH OGGY</h1>
            <p class="text-xs text-slate-400">Deriv Real-Time Live Market & Chart Dashboard</p>
        </div>
        <!-- Market Selector Buttons -->
        <div class="flex flex-wrap gap-2 mt-4 md:mt-0" id="market-buttons">
            <button onclick="switchMarket('R_100')" class="market-btn px-3 py-1.5 rounded-lg text-sm bg-green-600 text-white font-bold transition">Vol 100</button>
            <button onclick="switchMarket('R_75')" class="market-btn px-3 py-1.5 rounded-lg text-sm bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Vol 75</button>
            <button onclick="switchMarket('BOOM1000')" class="market-btn px-3 py-1.5 rounded-lg text-sm bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Boom 1000</button>
            <button onclick="switchMarket('CRASH1000')" class="market-btn px-3 py-1.5 rounded-lg text-sm bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Crash 1000</button>
            <button onclick="switchMarket('frxEURUSD')" class="market-btn px-3 py-1.5 rounded-lg text-sm bg-slate-800 text-slate-300 hover:bg-slate-700 transition">EUR/USD</button>
        </div>
    </header>

    <!-- Main Dashboard Grid -->
    <main class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- Chart Section (3 Columns) -->
        <div class="lg:col-span-3 bg-slate-900/90 p-4 rounded-xl border border-slate-800 shadow-2xl">
            <div class="flex justify-between items-center mb-3">
                <h2 id="current-market-title" class="text-lg font-semibold text-sky-400">Volatility 100 Index</h2>
                <span id="live-indicator" class="flex items-center text-xs text-green-400">
                    <span class="w-2.5 h-2.5 bg-green-500 rounded-full animate-pulse mr-1.5"></span> LIVE FEED
                </span>
            </div>
            <!-- Chart Container -->
            <div id="chart-container" class="w-full h-[400px]"></div>
        </div>

        <!-- Stats / Details Sidebar (1 Column) -->
        <div class="bg-slate-900/90 p-5 rounded-xl border border-slate-800 shadow-2xl flex flex-col justify-between">
            <div>
                <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-4">Market Stats</h3>
                
                <div class="mb-4 bg-slate-800/50 p-3 rounded-lg border border-slate-700/50">
                    <span class="text-xs text-slate-400 block">Current Price</span>
                    <span id="price-display" class="text-2xl font-bold text-green-400">--</span>
                </div>

                <div class="mb-4 bg-slate-800/50 p-3 rounded-lg border border-slate-700/50">
                    <span class="text-xs text-slate-400 block">Last Update Time</span>
                    <span id="time-display" class="text-sm text-slate-300">--:--:--</span>
                </div>
            </div>

            <div class="text-center text-xs text-slate-500 pt-4 border-t border-slate-800">
                Powered by Deriv WebSocket API
            </div>
        </div>

    </main>

    <!-- JavaScript Logic -->
    <script>
        const wsUrl = 'wss://ws.derivws.com/websockets/v3?app_id=1089';
        let ws;
        let chart;
        let lineSeries;
        let currentSymbol = 'R_100';
        let previousSymbol = null;

        // Initialize Lightweight Chart
        function initChart() {
            const chartContainer = document.getElementById('chart-container');
            chartContainer.innerHTML = ''; // Clear previous if any

            chart = LightweightCharts.createChart(chartContainer, {
                width: chartContainer.clientWidth,
                height: 400,
                layout: {
                    background: { type: 'solid', color: '#0b0f19' },
                    textColor: '#94a3b8',
                },
                grid: {
                    vertLines: { color: '#1e293b' },
                    horzLines: { color: '#1e293b' },
                },
                timeScale: {
                    timeVisible: true,
                    secondsVisible: true,
                    borderColor: '#334155',
                },
                rightPriceScale: {
                    borderColor: '#334155',
                },
            });

            lineSeries = chart.addLineSeries({
                color: '#4ade80',
                lineWidth: 2,
            });

            // Handle Window Resize
            window.addEventListener('resize', () => {
                chart.applyOptions({ width: chartContainer.clientWidth });
            });
        }

        // Connect WebSocket and Handle Feeds
        function connectWebSocket() {
            ws = new WebSocket(wsUrl);

            ws.onopen = function() {
                subscribeSymbol(currentSymbol);
            };

            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);

                // Handle History (Initial candles/ticks for chart)
                if (data.msg_type === 'history') {
                    const prices = data.history.prices;
                    const times = data.history.times;
                    const chartData = prices.map((price, index) => ({
                        time: times[index],
                        value: price
                    }));
                    lineSeries.setData(chartData);
                }

                // Handle Live Ticks
                if (data.msg_type === 'tick') {
                    const tick = data.tick;
                    if (tick.symbol === currentSymbol) {
                        const price = tick.quote;
                        const time = tick.epoch;

                        // Update UI Texts
                        document.getElementById('price-display').innerText = price;
                        document.getElementById('time-display').innerText = new Date(time * 1000).toLocaleTimeString();

                        // Update Chart
                        lineSeries.update({ time: time, value: price });
                    }
                }
            };

            ws.onerror = function(err) {
                console.error("WebSocket Error:", err);
            };
        }

        // Subscribe to a specific market symbol
        function subscribeSymbol(symbol) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                // Forget previous subscription if active
                if (previousSymbol && previousSymbol !== symbol) {
                    ws.send(JSON.stringify({ forget_all: "ticks" }));
                }

                currentSymbol = symbol;
                previousSymbol = symbol;

                // Request history for initial chart display (last 100 ticks)
                ws.send(JSON.stringify({
                    ticks_history: symbol,
                    adjust_start_time: 1,
                    count: 100,
                    end: "latest",
                    style: "ticks"
                }));

                // Subscribe to live ticks
                ws.send(JSON.stringify({ ticks: symbol }));
            }
        }

        // Switch Market Function called by buttons
        function switchMarket(symbol) {
            // Update active button styles
            const buttons = document.querySelectorAll('.market-btn');
            buttons.forEach(btn => {
                btn.classList.remove('bg-green-600', 'text-white', 'font-bold');
                btn.classList.add('bg-slate-800', 'text-slate-300');
            });
            event.target.classList.remove('bg-slate-800', 'text-slate-300');
            event.target.classList.add('bg-green-600', 'text-white', 'font-bold');

            // Update Header Title
            let marketNames = {
                'R_100': 'Volatility 100 Index',
                'R_75': 'Volatility 75 Index',
                'BOOM1000': 'Boom 1000 Index',
                'CRASH1000': 'Crash 1000 Index',
                'frxEURUSD': 'EUR/USD Forex Pair'
            };
            document.getElementById('current-market-title').innerText = marketNames[symbol] || symbol;

            // Subscribe new symbol
            subscribeSymbol(symbol);
        }

        // Run on page load
        window.onload = function() {
            initChart();
            connectWebSocket();
        };
    </script>
</body>
</html>
